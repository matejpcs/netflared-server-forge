name: Build Forge 26.x

on:
  push:
    branches: ["26.x"]
  pull_request:
    branches: ["26.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflared-forge-26-x
  cancel-in-progress: true

jobs:
  build:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1.1"
            forge: "63.0.0"
            java: "25"
          - mc: "26.1.2"
            forge: "64.1.3"
            java: "25"
          - mc: "26.2"
            forge: "65.0.0"
            java: "25"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s
' "${jars[@]}"
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: netflared-forge-26-x
          path: build/libs/*.jar
          if-no-files-found: error
