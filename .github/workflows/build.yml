name: Build Forge 1.21.x

on:
  push:
    branches: ["1.21.x"]
  pull_request:
    branches: ["1.21.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflared-forge-1-21-x
  cancel-in-progress: true

jobs:
  build:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21"
            forge: "51.0.33"
            java: "21"
          - mc: "1.21.1"
            forge: "52.1.16"
            java: "21"
          - mc: "1.21.2"
            forge: "53.0.0"
            java: "21"
          - mc: "1.21.3"
            forge: "53.1.0"
            java: "21"
          - mc: "1.21.4"
            forge: "54.1.0"
            java: "21"
          - mc: "1.21.5"
            forge: "55.0.3"
            java: "21"
          - mc: "1.21.6"
            forge: "56.0.9"
            java: "21"
          - mc: "1.21.7"
            forge: "57.0.3"
            java: "21"
          - mc: "1.21.8"
            forge: "58.0.2"
            java: "21"
          - mc: "1.21.9"
            forge: "59.0.3"
            java: "21"
          - mc: "1.21.10"
            forge: "60.0.0"
            java: "21"
          - mc: "1.21.11"
            forge: "61.2.1"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s
' "${jars[@]}"
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: netflared-forge-1-21-x
          path: build/libs/*.jar
          if-no-files-found: error
