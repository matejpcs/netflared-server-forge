name: Build Forge 1.20.x

on:
  push:
    branches: ["1.20.x"]
  pull_request:
    branches: ["1.20.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflared-forge-1-20-x
  cancel-in-progress: true

jobs:
  build:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20"
            forge: "46.0.14"
            java: "17"
          - mc: "1.20.1"
            forge: "47.4.23"
            java: "17"
          - mc: "1.20.2"
            forge: "48.1.0"
            java: "17"
          - mc: "1.20.3"
            forge: "49.0.2"
            java: "17"
          - mc: "1.20.4"
            forge: "49.2.0"
            java: "17"
          - mc: "1.20.5"
            forge: "50.0.32"
            java: "21"
          - mc: "1.20.6"
            forge: "50.2.10"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s
' "${jars[@]}"
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: netflared-forge-1-20-x
          path: build/libs/*.jar
          if-no-files-found: error
