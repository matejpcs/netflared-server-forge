name: Build Forge 1.20.x

on:
  push:
    branches: ["1.20.x"]
  pull_request:
    branches: ["1.20.x"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="1.20.1" -Pforge_version="47.4.23"
      - name: Verify JAR
        run: test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: netflared-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
