name: Build & Release Forge all versions
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"
permissions:
  contents: write
jobs:
  build:
    name: Build Forge ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.1"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.2"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.3"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.4"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.5"
            group: "1.20"
            java: "21"
            gradle: "8.14.3"
          - version: "1.20.6"
            group: "1.20"
            java: "21"
            gradle: "8.14.3"
          - version: "1.21"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.1"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.2"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.3"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.4"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.5"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.6"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.7"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.8"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.9"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.10"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.11"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "26.1"
            group: "26"
            java: "25"
            gradle: "9.5.1"
          - version: "26.2"
            group: "26"
            java: "25"
            gradle: "9.5.1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Resolve Forge version
        id: deps
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          forge="$(curl -fsSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | jq -r --arg mc "$VERSION" '.promos[$mc+"-recommended"] // .promos[$mc+"-latest"] // empty')"
          test -n "$forge" && test "$forge" != "null"
          echo "forge=$forge" >> "$GITHUB_OUTPUT"
          echo "Forge for Minecraft $VERSION: $forge"
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          FORGE_VERSION: ${{ steps.deps.outputs.forge }}
        run: |
          set -euo pipefail
          gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="$RELEASE_VERSION" -Pminecraft_version="$VERSION" -Pforge_version="$FORGE_VERSION"
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          test -n "$jar"
          cp "$jar" "netflared-server-forge-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.version }}
          path: netflared-server-forge-${{ matrix.version }}.jar
  release:
    name: Release Forge ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20","1.21","26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: forge-${{ matrix.group }}*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}-forge-${{ matrix.group }}
          name: Netflared Server ${{ inputs.release_version }} — Forge ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar
