name: Build & Release Forge compatibility bundles

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.11"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Forge 1.20.1"
            ref: "1.20.x"
            mc: "1.20.1"
            forge: "47.4.23"
            java: "17"
            gradle: "8.8"
            artifact: "netflared-forge-1.20.1"
          - label: "Forge 1.21.11"
            ref: "1.21.x"
            mc: "1.21.11"
            forge: "61.2.1"
            java: "21"
            gradle: "9.5.1"
            artifact: "netflared-forge-1.21.11"
          - label: "Forge 26.2"
            ref: "26.x"
            mc: "26.2"
            forge: "65.0.0"
            java: "25"
            gradle: "9.5.0"
            artifact: "netflared-forge-26.2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="0.1.11" -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - name: Verify JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s\n' "${jars[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.11' }}"
          name: "Netflared Server ${{ inputs.release_version || '0.1.11' }} — Forge"
          target_commitish: main
          generate_release_notes: true
          files: release/*.jar
