name: Build & Release Forge compatibility bundles

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Netflared mod release version
        required: true
        default: "0.1.0"
  push:
    tags:
      - "server-v*"

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.7.1"

jobs:
  build-1-20:
    name: Forge 1.20.x / ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.20", forge: "46.0.14", java: "17" }
          - { mc: "1.20.1", forge: "47.4.23", java: "17" }
          - { mc: "1.20.2", forge: "48.1.0", java: "17" }
          - { mc: "1.20.3", forge: "49.0.38", java: "17" }
          - { mc: "1.20.4", forge: "49.2.0", java: "17" }
          - { mc: "1.20.5", forge: "50.0.32", java: "21" }
          - { mc: "1.20.6", forge: "50.2.10", java: "21" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1.20.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: gradle clean build --no-daemon -Pmod_version="${{ inputs.release_version || '0.1.0' }}" -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-forge-1.20-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  build-1-21:
    name: Forge 1.21.x / ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21", forge: "51.0.33" }
          - { mc: "1.21.1", forge: "52.1.16" }
          - { mc: "1.21.2", forge: "53.0.0" }
          - { mc: "1.21.3", forge: "53.1.0" }
          - { mc: "1.21.4", forge: "54.1.0" }
          - { mc: "1.21.5", forge: "55.0.3" }
          - { mc: "1.21.6", forge: "56.0.9" }
          - { mc: "1.21.7", forge: "57.0.7" }
          - { mc: "1.21.8", forge: "58.0.2" }
          - { mc: "1.21.9", forge: "59.0.3" }
          - { mc: "1.21.10", forge: "60.0.0" }
          - { mc: "1.21.11", forge: "61.2.1" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1.21.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: |
          gradle clean build --no-daemon -Pmod_version="${{ inputs.release_version || '0.1.0' }}" -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-forge-1.21-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  build-26:
    name: Forge 26.x / ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1.1", forge: "63.0.0" }
          - { mc: "26.1.2", forge: "64.1.3" }
          - { mc: "26.2", forge: "65.0.0" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 26.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build and test
        run: |
          gradle clean build --no-daemon -Pmod_version="${{ inputs.release_version || '0.1.0' }}" -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netflared-forge-26-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  all-builds:
    name: All Forge compatibility builds passed
    needs: [build-1-20, build-1-21, build-26]
    if: ${{ always() && needs.build-1-20.result == 'success' && needs.build-1-21.result == 'success' && needs.build-26.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "All 22 Forge compatibility builds passed."

  release-1-20:
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-forge-1.20-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.0' }}-1.20.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.0' }} — Forge 1.20.x"
          target_commitish: 1.20.x
          generate_release_notes: true
          files: release/*.jar

  release-1-21:
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-forge-1.21-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.0' }}-1.21.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.0' }} — Forge 1.21.x"
          target_commitish: 1.21.x
          generate_release_notes: true
          files: release/*.jar

  release-26:
    needs: all-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netflared-forge-26-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.0' }}-26.x"
          name: "Netflared Server ${{ inputs.release_version || '0.1.0' }} — Forge 26.x"
          target_commitish: 26.x
          generate_release_notes: true
          files: release/*.jar
