name: Build & Release Forge versions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Release ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Forge 1.20.1"
            ref: "1.20.x"
            mc: "1.20.1"
            forge: "47.4.23"
            java: "17"
            gradle: "8.8"
          - label: "Forge 1.21.11"
            ref: "1.21.x"
            mc: "1.21.11"
            forge: "61.2.1"
            java: "21"
            gradle: "9.5.1"
          - label: "Forge 26.2"
            ref: "26.x"
            mc: "26.2"
            forge: "65.0.0"
            java: "25"
            gradle: "9.5.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="${{ inputs.release_version }}" -Pminecraft_version="${{ matrix.mc }}" -Pforge_version="${{ matrix.forge }}"
      - name: Verify JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s\n' "${jars[@]}"
      - name: Release version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version }}-forge-${{ matrix.mc }}"
          name: "Netflared Server ${{ inputs.release_version }} — forge ${{ matrix.mc }}"
          target_commitish: ${{ matrix.ref }}
          generate_release_notes: false
          files: build/libs/*.jar
