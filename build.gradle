plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.46' }
group='com.matejpcs.netflared'
version=project.findProperty('mod_version') ?: '0.1.8-SNAPSHOT'
def mc=project.findProperty('minecraft_version') ?: '1.20.1'
def forge=project.findProperty('forge_version') ?: '47.4.23'
def forgeMajor=forge.tokenize('.')[0]
def javaVersion=mc in ['1.20.5','1.20.6'] ? 21 : 17
java.toolchain.languageVersion=JavaLanguageVersion.of(javaVersion)
minecraft { mappings channel:'official', version:mc; copyIdeResources=true; runs { server { workingDirectory project.file('run'); args '--nogui' } } }
repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:" + mc + "-" + forge;
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=javaVersion }
processResources {
 inputs.properties(version:project.version, minecraft_version:mc, forge_major:forgeMajor)
 filesMatching('META-INF/mods.toml') { expand(version:project.version, minecraft_version:mc, forge_major:forgeMajor) }
}
jar { archiveBaseName='netflared-server-forge' }
